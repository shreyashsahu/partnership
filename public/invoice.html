<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHIVIRA JEWELS — Bill</title><style>*{box-sizing:border-box}body{margin:0;background:#f0eee7;color:#222;font-family:Arial,sans-serif}.invoice{max-width:850px;margin:35px auto;background:#fff;padding:42px;box-shadow:0 14px 50px #0002}.head{display:flex;justify-content:space-between;border-bottom:2px solid #c6a548;padding-bottom:24px}.brand{font:700 28px Georgia;color:#9b771e}.muted{color:#666}.title{text-align:right}.title h1{margin:0;font:700 34px Georgia}.cols{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin:28px 0}.box{padding:18px;background:#faf9f5;border:1px solid #e8dfc7;border-radius:12px}.box b{display:block;margin-bottom:8px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px;border-bottom:1px solid #ddd;text-align:left}.table th{background:#f4f0e4}.total{text-align:right;margin-top:18px;font-size:22px}.total b{color:#9b771e}.approved{display:inline-block;padding:7px 12px;border-radius:999px;background:#e8f6e9;color:#28753a;font-weight:700}.ready{margin-top:10px}.thanks{text-align:center;margin-top:40px;padding:22px;border-top:1px solid #ddd;font-size:18px;color:#9b771e}.actions{display:flex;gap:10px;justify-content:center;max-width:850px;margin:0 auto 35px}.actions button{padding:11px 18px;border-radius:8px;border:1px solid #9b771e;background:#fff;cursor:pointer}.actions .gold{background:#9b771e;color:#fff}@media(max-width:650px){.invoice{margin:0;padding:20px}.head,.cols{display:block}.title{text-align:left;margin-top:18px}.table{font-size:12px}}@media print{body{background:#fff}.invoice{margin:0;box-shadow:none}.actions{display:none}}
</style></head><body><div class="invoice" id="invoice"><div class="head"><div><div class="brand">🔱 SHIVIRA JEWELS</div><div class="muted">Majhawan, Kanpur Nagar, Uttar Pradesh</div><div class="muted">6306940177 • 9305008634</div></div><div class="title"><h1>BILL</h1><div id="meta" class="muted"></div></div></div><div class="cols"><div class="box"><b>Bill To</b><div id="customer"></div></div><div class="box"><b>Order Details</b><div id="orderMeta"></div></div></div><table class="table"><thead><tr><th>Product</th><th>Qty</th><th>Unit Price</th><th>Amount</th></tr></thead><tbody id="items"></tbody></table><div class="total">Grand Total: <b id="total"></b></div><div class="thanks" id="thanks">Thank you for choosing SHIVIRA JEWELS.<br><strong>Please visit SHIVIRA JEWELS again.</strong></div></div><div class="actions"><button class="gold" onclick="window.print()">Print / Save as PDF</button><button onclick="location.href='/'">Back to Website</button></div><script>const q=new URLSearchParams(location.search),id=q.get('orderId');const money=n=>'₹'+Number(n||0).toLocaleString('en-IN');async function run(){if(!id)return;const r=await fetch('/api/orders/'+encodeURIComponent(id));const d=await r.json();if(!r.ok){document.getElementById('invoice').innerHTML='<h2>Bill not found.</h2>';return}const o=d.order;meta.textContent='Order ID: '+o.id+' • '+new Date(o.createdAt).toLocaleString('en-IN');customer.innerHTML='<strong>'+o.name+'</strong><br>'+o.phone+'<br>'+ (o.email||'')+'<br>'+o.address+'<br>'+o.city+' '+o.state+' '+o.pin;orderMeta.innerHTML='<span class="approved">'+o.status+'</span><div class="ready">Estimated making time: <strong>'+o.productionDays+' days</strong><br>Expected ready date: <strong>'+new Date(o.readyBy).toLocaleDateString('en-IN')+'</strong><br>Order date: '+new Date(o.createdAt).toLocaleDateString('en-IN')+'</div>';items.innerHTML=o.items.map(i=>'<tr><td>'+i.name+'</td><td>'+i.quantity+'</td><td>'+money(i.price)+'</td><td>'+money(i.price*i.quantity)+'</td></tr>').join('');total.textContent=money(o.total);thanks.innerHTML='Thank you for choosing SHIVIRA JEWELS.<br><strong>'+((d.shopMessage||'Please visit SHIVIRA JEWELS again.'))+'</strong>'}run();</script></body></html>
