<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHIVIRA JEWELS — Owner Access</title><link rel="stylesheet" href="/admin.css"></head><body class="owner-entry"><div class="screen"><div class="auth-card wide"><div class="logo">🔱 SHIVIRA JEWELS</div><div id="setupBox"><h1>Owner Sign Up</h1><p>Create the one private owner account. This setup disappears after the first account is created.</p><form id="signupForm"><input id="suUsername" placeholder="Owner username" required minlength="3" autocomplete="username"><input id="suPassword" type="password" placeholder="Password (8+ characters)" required minlength="8" autocomplete="new-password"><input id="suPassword2" type="password" placeholder="Confirm password" required minlength="8" autocomplete="new-password"><button>Create Owner Account</button><div id="setupMsg"></div></form></div><div id="loginBox" class="hidden"><h1>Owner Login</h1><p>Private access for SHIVIRA JEWELS owner only.</p><form id="loginForm"><input id="username" placeholder="Owner username" required autocomplete="username"><input id="password" type="password" placeholder="Owner password" required autocomplete="current-password"><button>Sign in securely</button><div id="loginMsg"></div></form></div></div></div><script>
const $=s=>document.querySelector(s);async function status(){const r=await fetch('/api/admin/setup-status');const d=await r.json();$('#setupBox').classList.toggle('hidden',!d.setupRequired);$('#loginBox').classList.toggle('hidden',d.setupRequired)}
$('#signupForm').onsubmit=async e=>{e.preventDefault();if($('#suPassword').value!==$('#suPassword2').value)return $('#setupMsg').textContent='Passwords do not match.';$('#setupMsg').textContent='Creating owner account…';try{const r=await fetch('/api/admin/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('#suUsername').value.trim(),password:$('#suPassword').value})});const d=await r.json();if(!r.ok)throw Error(d.message);location.href='/admin'}catch(err){$('#setupMsg').textContent=err.message}};
$('#loginForm').onsubmit=async e=>{e.preventDefault();$('#loginMsg').textContent='Signing in…';try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('#username').value.trim(),password:$('#password').value})});const d=await r.json();if(!r.ok)throw Error(d.message);location.href='/admin'}catch(err){$('#loginMsg').textContent=err.message}};status();
</script></body></html>
